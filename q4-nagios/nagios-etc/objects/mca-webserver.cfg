define host {
    use                     generic-host
    host_name               MCA-WebServer
    alias                   MCA Web Server
    address                 host.docker.internal
    check_command           check-host-alive
    max_check_attempts      3
    check_interval          1
    retry_interval          1
}

define service {
    use                     generic-service
    host_name               MCA-WebServer
    service_description     HTTP Port 8080
    check_command           check_http!-p 8080
    check_interval          1
    retry_interval          1
}
